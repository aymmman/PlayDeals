name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FEED_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/deals-data/
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          shopt -s nullglob
          for f in *.zip; do unzip -o -q "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-configuration-cache
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/PlayDeals-build-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PlayDeals-build-${{ github.run_number }}
          path: out/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PlayDeals build ${{ github.run_number }}
          files: out/*.apk
          prerelease: true
      - name: Unit tests
        run: gradle testDebugUnitTest --no-configuration-cache
